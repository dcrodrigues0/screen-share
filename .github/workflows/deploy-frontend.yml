name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment: gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes nsis

      - name: Install Rust targets and build tools
        run: |
          rustup target add wasm32-unknown-unknown x86_64-pc-windows-msvc
          cargo install cargo-xwin --locked
          cargo install trunk --locked
          cargo install tauri-cli --locked

      - name: Build Windows installer
        working-directory: frontend
        env:
          SIGNALING_WS_URL: ${{ secrets.SIGNALING_WS_URL }}
        run: |
          if [ -z "$SIGNALING_WS_URL" ]; then
            echo "Set SIGNALING_WS_URL as a GitHub Actions variable in the gcp environment."
            exit 1
          fi
          cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload installer to Cloud Storage
        env:
          FRONTEND_BUCKET: ${{ secrets.GCP_FRONTEND_BUCKET }}
        run: |
          if [ -z "$FRONTEND_BUCKET" ]; then
            echo "Set the GCP_FRONTEND_BUCKET repository variable."
            exit 1
          fi

          installer=$(find frontend -type f -path '*/bundle/nsis/*.exe' -print -quit)
          if [ -z "$installer" ]; then
            echo "The Windows NSIS installer was not found."
            exit 1
          fi

          versioned_path="gs://${FRONTEND_BUCKET}/windows/${GITHUB_SHA}/"
          latest_path="gs://${FRONTEND_BUCKET}/windows/latest/"
          gcloud storage cp "$installer" "$versioned_path"
          gcloud storage cp "$installer" "$latest_path"
