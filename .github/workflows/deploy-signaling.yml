name: Deploy signaling server

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-signaling.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  REPOSITORY: signaling

concurrency:
  group: deploy-signaling
  cancel-in-progress: false

jobs:
  deploy:
    environment: gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/signaling:${GITHUB_SHA}"
          docker build --file backend/Dockerfile --tag "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run service with Terraform
        working-directory: backend/infra
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.GCP_TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=signaling"
          terraform apply -input=false -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="image=${IMAGE}"
