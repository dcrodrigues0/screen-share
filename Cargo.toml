[package]
name = "screen-kei-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.151"
console_error_panic_hook = "0.1.7"
log = "0.4.34"
leptos-use = "0.19.2"
uuid = {version = "1.27.0", features = ["v4", "js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Navigator",
    "MediaDevices",
    "MediaStreamConstraints",
    "MediaStream",
    "HtmlVideoElement",
    "RtcPeerConnection",
    "RtcSessionDescriptionInit",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcPeerConnectionIceEvent",
    "RtcTrackEvent",
    "RtcIceConnectionState",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcSdpType",
    "MessageEvent",
    "Event",
    "WebSocket"
]

[workspace]
members = ["signaling-server","src-tauri"]
